/*ANIM-LIST*/const ANIM_LIST = {"boss_bulgasari":4,"boss_cheonyeo":4,"boss_egg":4,"boss_eoduk":4,"boss_gangcheol":4,"boss_gumiho":4,"boss_imugi":4,"boss_jeoseung":4,"boss_mul":4,"e_bat":4,"e_boss":4,"e_centipede":4,"e_fox":4,"e_grunt":4,"e_lord":4,"e_mole":4,"e_shield":4,"e_siege":4,"h_ansi":4,"h_jeongyakyong":4,"h_kimsimin":4,"h_kimyunhu":4,"h_kwon":4,"h_leejeongam":4,"h_parkseo":4,"h_yanghunsu":4,"h_yeon":4,"u_archer":4,"u_cavalry":4,"u_militia":4,"u_spear":4,"u_sword":4};/*ANIM-END*/

  const src = typeof ART_SRC === "object" ? ART_SRC : {}, img = {}, cache = new Map(), masks = {};
  let left = Object.keys(src).length, waiters = [];
  const finish = () => { const w = waiters; waiters = []; w.forEach(f => f()); };
  let booted = false, lateT = 0; const api = {};
  const late = () => { if (!booted || !api.onLate) return; clearTimeout(lateT); lateT = setTimeout(() => api.onLate(), 60); }; // 시작 뒤 늦게 들어온 그림 → 다시 그리기 신호
  Object.keys(src).forEach(k => { const im = new Image();
    im.onload = () => { img[k] = im; if (k === "k_title"){ document.documentElement.style.setProperty("--title-bg", 'url("' + src.k_title + '")'); try { fitScene(); } catch(e){} } late(); if (--left <= 0) finish(); };
    im.onerror = () => { if (--left <= 0) finish(); }; im.src = src[k]; });
  const anim = {};
  const loadAnim = (k, n) => { const keys = []; let got = 0; for (let i = 0; i < n; i++){ const kk = k + "#" + i, im = new Image(); keys.push(kk);
      im.onload = () => { img[kk] = im; if (++got === n){ anim[k] = keys; late(); } }; im.onerror = () => {}; im.src = "art/anim/" + k + "_" + i + ".webp?v=" + ANIM_VER; } };
  try { Object.keys(typeof ANIM_LIST === "object" ? ANIM_LIST : {}).forEach(k => loadAnim(k, ANIM_LIST[k])); } catch(e){}
  return Object.assign(api, {
    img, src, anim,
    ok(k){ return !!img[k]; }, // 실제로 불러와진 그림만 쓴다(실패한 그림은 깨진 자리 대신 대체 그림)
    url(k){ return img[k] ? src[k] : ""; },
    booted(){ booted = true; },
    wait(fn, ms){ if (left <= 0) return fn(); let done = false; const go = () => { if (!done){ done = true; fn(); } }; waiters.push(go); setTimeout(go, ms || 2500); },
    // 크기·뒤집기·하얀 번쩍 판을 미리 그려 둔 캔버스 (매 프레임 큰 그림 줄이기 방지)
    get(k, w, h, flip, white){
      const im = img[k]; if (!im) return null;
      const pw = Math.max(1, Math.round(w)), ph = Math.max(1, Math.round(h)), key = k + "|" + pw + "|" + ph + "|" + (flip ? 1 : 0) + (white ? 1 : 0) + (this.dim && !white ? "d" : "");
      let c = cache.get(key); if (c) return c;
      c = document.createElement("canvas"); c.width = pw; c.height = ph; const x = c.getContext("2d"); x.imageSmoothingQuality = "high";
      if (flip){ x.translate(pw, 0); x.scale(-1, 1); }
      // 큰 그림을 한 번에 많이 줄이면 거칠어지므로 반씩 줄여 간다
      let s = im, sw = im.naturalWidth, sh = im.naturalHeight;
      while (sw > pw*2 && sh > ph*2){ const t = document.createElement("canvas"); t.width = Math.round(sw/2); t.height = Math.round(sh/2); t.getContext("2d").drawImage(s, 0, 0, t.width, t.height); s = t; sw = t.width; sh = t.height; }
      if (this.dim && !white && "filter" in x) x.filter = "brightness(.8) saturate(.88)"; // 요청 50: 손그림 바탕일 때 어둡게 — 매번 c.filter 대신 그림을 만들 때 한 번만(느림 고침)
      x.drawImage(s, 0, 0, pw, ph); x.filter = "none";
      if (white){ x.setTransform(1,0,0,1,0,0); x.globalCompositeOperation = "source-atop"; x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, pw, ph); }
      if (cache.size > 400) cache.clear();
      cache.set(key, c); return c;
    },
    // 바닥 가운데(bx,by) 기준으로 높이 h 만큼 그린다
    drawAt(c, k, bx, by, h, flip, white, dpr){
      const D0 = this.def, AN = D0 && anim[k];
      if (AN){ const n = AN.length, tt = D0.t || 0, cyc = x => ((x % 1) + 1) % 1; let fi = 0;
        if (D0.m === "fly") fi = Math.floor(cyc(tt*(D0.fs || 11)/(Math.PI*2))*n);
        else if (D0.m === "float") fi = Math.floor(cyc(tt*.8)*n);
        else if (D0.a > .3) fi = Math.floor(cyc((D0.ph || 0)/(Math.PI*2))*n);
        k = AN[fi]; const im2 = img[k]; if (!im2) return false;
        const w2 = h*im2.naturalWidth/im2.naturalHeight, d2 = dpr || 1, cv2 = this.get(k, w2*d2, h*d2, flip, white); c.drawImage(cv2, bx - w2/2, by - h, w2, h); return true; } // 요청 51: 팔다리가 실제로 움직이는 장면 넘기기
      const im = img[k]; if (!im) return false;
      const w = h * im.naturalWidth / im.naturalHeight, d = dpr || 1, cv = this.get(k, w*d, h*d, flip, white);
      const D = this.def; if (D && this.gaitFn && (D.a > .03 || D.m === "fly" || D.m === "float")){ this.gaitFn(c, cv, bx - w/2, by - h, w, h, D, white); return true; } // 요청 50: 걷기·뛰기·기기·날기·떠다니기
      c.drawImage(cv, bx - w/2, by - h, w, h); return true;
    },
    def:null, // 요청 50: {m:"walk"|"run"|"crawl"|"fly"|"float", ph(걸음 위상), a(움직이는 정도 0~1), dir(화면에서 가는 쪽 ±1), t(시간), fs(날갯짓 빠르기)}
    withDef(D, fn){ const o = this.def; this.def = D; try { return fn(); } finally { this.def = o; } },
    // drawAt 이 그릴 사각형(바닥 가운데 기준). 그리기와 터치 판정이 같은 계산을 쓴다
    rectAt(k, bx, by, h){ const im = img[k]; if (!im) return null; const w = h * im.naturalWidth / im.naturalHeight; return {x:bx - w/2, y:by - h, w, h}; },
    // 터치 판정용 알파 마스크(가로 64칸). 그림마다 한 번만 만든다. 만들 수 없으면 null → 사각형 판정
    mask(k){
      if (k in masks) return masks[k];
      const im = img[k]; if (!im) return null;
      const W = 64, H = Math.max(1, Math.round(64 * im.naturalHeight / im.naturalWidth));
      try { const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d"); x.drawImage(im, 0, 0, W, H);
        const d = x.getImageData(0, 0, W, H).data, a = new Uint8Array(W*H); for (let i=0;i<a.length;i++) a[i] = d[i*4+3]; masks[k] = {W, H, a}; }
      catch(e){ masks[k] = null; }
      return masks[k];
    },
    // 사각형 r(rectAt 결과) 안의 (px,py)가 그림의 불투명한 곳이면 true. 투명한 곳은 뒤에 있는 대상·칸으로 넘긴다
    hitAt(k, r, px, py, flip){
      if (!r || px < r.x || px > r.x + r.w || py < r.y || py > r.y + r.h) return false;
      const m = this.mask(k); if (!m) return true;
      let u = (px - r.x) / r.w; if (flip) u = 1 - u;
      const mx = Math.min(m.W - 1, Math.floor(u * m.W)), my = Math.min(m.H - 1, Math.floor((py - r.y) / r.h * m.H));
      for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++){ const xx = mx + dx, yy = my + dy; if (xx >= 0 && yy >= 0 && xx < m.W && yy < m.H && m.a[yy*m.W + xx] > 40) return true; } // 손가락 여유 1칸
      return false;
    }
  });
})();
(function(){
"use strict";
// 지도 크기는 지도마다 다를 수 있다(MAPS[k].cols/rows). 화면(보이는 창)은 늘 BASE 9×13+성벽 크기이고, 더 큰 지도는 카메라(Cam)로 옮겨 본다.
// COLS/ROWS/WALL 은 '지금 다루는 지도'의 값: useMap(m) 으로 바뀐다(mapGrid·drawStatic·newRun 이 부름). 사면 성곽(m.gates)은 아래 성벽 띠가 없다(WALL 0).

  function updHero(dt){

  // 진 판(시간 끝 포함)에 '광고 보고 쉽게 다시 하기' 단추. 도움 받은 판에서 또 지면 더 낮추지 않는다

  function makeBg(){

const CASTLE_MAXH = 12; // 꺼 둔 동안 보상은 최대 12시간분

const castleRate = () => BUILD.reduce((a,b) => a + (b.rate ? b.rate*castleLv(b.k) : 0), 0); // 옥/시간

function castleNeed(b){ const n = b.need; if (!n) return ""; if (n.stars && starsTotal() < n.stars) return "별 "+n.stars+"개 필요"; return ""; }
// 꺼 둔 동안 쌓인 옥 = 대기 옥(acc, 강화 때 정산한 소수 포함) + 기준 시각(last) 뒤로 지금 빠르기로 쌓인 양(최대 12시간분).

  if (castleClockBack()) return; M.castle.acc = castleRaw(); M.castle.last = Date.now(); }

const MISSIONS = { // 오늘의 임무: 한국 날짜로 3개를 뽑는다
  kill:   {name:"적 150마리 물리치기",      goal:150, jade:40},
  cannon: {name:"총통 3개 세우기",           goal:3,   jade:30},

  win:    {name:"아무 장이나 이기기",       goal:1,   jade:30},

  castle: {name:"내 성 건물 1번 고치기",     goal:1,   jade:30, need:() => BUILD.some(b => castleLv(b.k) < 3 && !castleNeed(b))} // 더 고칠 건물이 없으면 뽑지 않는다

const MISSION_ALL = 60; // 셋 다 하면 더 주는 옥
function misPool(day){ // 그 날짜로 섞은 후보 순서(지금 할 수 없는 임무는 빼고). 앞의 3개가 그날 임무
  let seed = 11; for (let i=0;i<day.length;i++) seed = (seed*31 + day.charCodeAt(i)) | 0;
  const r = rng(seed), pool = Object.keys(MISSIONS).filter(k => !MISSIONS[k].need || MISSIONS[k].need()), out = [];
  while (pool.length) out.push(pool.splice(Math.floor(r()*pool.length), 1)[0]); return out; }
function ensureMissions(){
  const today = kstDate(), mi = M.mis;
  // 미래 날짜 임무: 그 날 실제로 받은 기록이 있으면(시계를 되돌림) 그날까지 새 임무 없음. 받은 기록이 없으면(날짜가 앞선 채 한 번 켜졌을 뿐) 오늘 임무로 바꾼다
  if (mi.day > today && (Object.keys(mi.got).length || mi.all || Ledger.hasMis(mi.day))) return;
  // 그날 임무 목록은 원장에 고정한다(처음 만든 목록). 어떤 저장을 불러와도 원장 목록을 쓰고, 이미 받은 임무는 빠지지 않는다
  const le = Ledger.misOf(today), fixed = le && le.ids ? le.ids.slice() : null;
  let ch = false;
  if (mi.day !== today || mi.ids.length !== 3){ M.mis = {day:today, ids:fixed || misPool(today).slice(0,3), prog:{}, got:{}, all:false}; ch = true; }
  else if (fixed && fixed.join() !== mi.ids.join()){ const prog = {}; fixed.forEach(id => { if (mi.prog[id]) prog[id] = mi.prog[id]; }); M.mis = {day:today, ids:fixed, prog, got:{}, all:!!mi.all}; ch = true; }
  const cur = M.mis; Ledger.mergeMis(cur);
  // 바꿀 수 있는 것은 '받지 않았고, 지금 할 수 없는(고칠 건물 없음 등)' 임무뿐
  const pool = misPool(today);
  cur.ids.forEach((id,i) => { const q = MISSIONS[id]; if (!q.need || q.need() || cur.got[id] || (cur.prog[id] || 0) >= q.goal) return;
    const alt = pool.find(k => cur.ids.indexOf(k) < 0); if (alt){ cur.ids[i] = alt; delete cur.prog[id]; ch = true; } });
  Ledger.setIds(today, cur.ids);
  if (ch) saveMeta();
}
const misGotToday = () => { const e = Ledger.misOf(kstDate()); const s = new Set(e ? Object.keys(e.got) : []); if (M.mis.day === kstDate()) Object.keys(M.mis.got).forEach(k => s.add(k)); return s; };
function mprog(id, n, asMax){ // 임무 진행: 오늘 임무에 있을 때만. 저장은 부르는 쪽(판 끝·물결 끝)에서
  if (!M) return;
  if (R && R.test && !R.over && id !== "chest" && id !== "castle") return; // 시험 지도에서는 임무가 오르지 않게
  if (M.mis.day < kstDate()) ensureMissions(); // 싸우는 중에 자정을 넘겨도 오늘 임무에 쌓이게(지급은 오늘 키 기준 한 번)
  if (M.mis.day !== kstDate() || M.mis.ids.indexOf(id) < 0) return;
  const g = MISSIONS[id].goal, v = M.mis.prog[id] || 0; M.mis.prog[id] = Math.min(g, asMax ? Math.max(v, n) : v + n);
}
// 오늘 임무 '세 자리': 화면·개별 보상·보너스가 모두 이 함수 하나로 판단한다(검수 v4b 4차).
// 받은 임무(원장 + 이 진행, 다른 기기에서 가져온 수령 포함)가 자리를 먼저 차지하고, 남은 자리는 오늘 목록의 받지 않은 임무로 채운다.
function missionDay(){
  const today = kstDate(), live = M.mis.day === today, got = live ? misGotToday() : new Set(Object.keys(M.mis.got));
  const slots = M.mis.ids.slice(0, 3);
  [...got].filter(id => Object.prototype.hasOwnProperty.call(MISSIONS, id) && slots.indexOf(id) < 0).forEach(id => {
    for (let i = slots.length - 1; i >= 0; i--){ if (!got.has(slots[i])){ slots[i] = id; return; } } });
  const le = live ? Ledger.misOf(today) : null, allPaid = !!M.mis.all || !!(le && le.all);

}
const misDoneId = (D, id) => !!id && (D.got.has(id) || (M.mis.prog[id] || 0) >= MISSIONS[id].goal);
const misDone = i => { const D = missionDay(); return misDoneId(D, D.ids[i]); };
const misAllGot = () => missionDay().full;
const misClaimable = () => { const D = missionDay(); return D.live && ((D.got.size < 3 && D.ids.some(id => !D.got.has(id) && misDoneId(D, id))) || (!D.allPaid && D.full)); };
function claimMission(i){ // 한 번만, 오늘 임무일 때만 (지급 표시는 임무 ID에). i = missionDay().ids 의 자리
  const D = missionDay(), id = D.ids[i];
  if (!D.live || !id || D.got.has(id) || D.got.size >= 3 || (M.mis.prog[id] || 0) < MISSIONS[id].goal) return 0; // 하루 임무 보상은 세 자리(원장 기준)
  const g = MISSIONS[id].jade; M.mis.got[id] = 1; M.jade += g; saveMeta(); Track.event("mission", {id, jade:g}); Sound.play("coin"); return g;
}
function claimMissionAll(){
  const D = missionDay();
  if (!D.live || !D.full) return 0;
  if (D.allPaid){ M.mis.all = true; return 0; } // 보너스는 하루 한 번(원장 기준)
  M.mis.all = true; M.jade += MISSION_ALL; saveMeta(); Track.event("mission", {id:"all", jade:MISSION_ALL}); Sound.play("coin"); return MISSION_ALL;
}

// 알림: @capacitor/local-notifications v8 (앱에서만). 하루 한 번, 평소 게임을 켜는 시각(최근 7일 중앙값)에. 밤 10시~아침 8시는 피한다
const NOTIFY = {id:7001, title:"산성", body:"보물 상자와 오늘의 임무가 준비됐어요", def:20, quietFrom:22, quietTo:8};
const Notify = {
  plugin(){ const C = window.Capacitor; return (C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.LocalNotifications) || null; },
  hour(){ const hs = M.play.map(p => p.h).sort((a,b) => a-b); let h = hs.length ? hs[Math.floor((hs.length - 1)/2)] : NOTIFY.def;
    if (h >= NOTIFY.quietFrom) h = NOTIFY.quietFrom - 1; if (h < NOTIFY.quietTo) h = NOTIFY.quietTo; return h; },
  localHour(h){ const off = -new Date().getTimezoneOffset()/60; return (((h - 9 + off) % 24) + 24) % 24; }, // 한국 시각 h시 → 이 폰 시계의 시(한국 폰이면 같다)
  q:Promise.resolve(),
  // 예약·취소·권한 요청을 한 줄로 차례대로 처리한다(켜고 끄기가 겹쳐도 마지막 설정대로). → "web" | "off" | "denied" | "set" | "same" | "error"
  seq:0,
  sync(ask){ const seq = ++this.seq; const p = this.q.then(() => this._sync(ask, seq)); this.q = p.catch(() => {}); return p; },
  async _sync(ask, seq){
    if (seq !== undefined && seq !== this.seq && !M.set.notif) return "off"; // 뒤에 더 새 요청(끄기)이 줄 서 있으면 그쪽에 맡긴다
    const L = this.plugin(); if (!L) return "web";
    try {
      if (!M.set.notif){ await L.cancel({notifications:[{id:NOTIFY.id}]}); Device.set("notifHour", -1); return "off"; }
      let p = await L.checkPermissions();
      if (!p || p.display !== "granted"){
        if (!ask && (Device.get().notifAsked || M.set.notifAsked)) return "denied"; // 권한은 처음 한 번(또는 설정에서 다시 켤 때)만. 물었다는 기록은 이 기기 키에
        if (!M.set.notif || (seq !== undefined && seq !== this.seq)) return "off"; // 권한을 묻기 직전: 최신 설정이 꺼졌거나 더 새 요청이 왔으면 묻지 않는다
        Device.set("notifAsked", true); p = await L.requestPermissions();
        if (!M.set.notif) return "off"; // 묻는 사이 꺼졌으면 예약하지 않는다(끄기는 뒤 차례에서 취소)
        if (!p || p.display !== "granted") return "denied";
      }
      const lh = this.localHour(this.hour());
      let have = false; try { const pend = await L.getPending(); have = !!(pend && Array.isArray(pend.notifications) && pend.notifications.some(n => n && n.id === NOTIFY.id)); } catch(e){}
      if (have && Device.get().notifHour === lh) return "same"; // 시각이 그대로면 다시 예약하지 않는다(접속할 때마다 밀리지 않게)
      if (!M.set.notif) return "off";
      // 매일 반복: Capacitor LocalNotifications v8 문서의 schedule.on(ScheduleOn) — {hour, minute} 가 맞는 때마다(=매일 그 시각) 울린다.
      // 정확한 시각이 필요 없어 allowWhileIdle:false(SCHEDULE_EXACT_ALARM 불필요). 같은 id라 예전 예약을 덮어쓴다.
      await L.schedule({notifications:[{id:NOTIFY.id, title:NOTIFY.title, body:NOTIFY.body, schedule:{on:{hour:lh, minute:0}, allowWhileIdle:false}}]});
      Device.set("notifHour", lh); Track.event("notify_set", {h:this.hour()}); return "set";
    } catch(e){ return "error"; }
  }
};

// 저장 코드: 'SSD1:' + 저장 JSON(UTF-8)의 base64 + ':' + 검사값. 폰을 바꿀 때 옮기기용.
// 로컬 게임의 한계: 저장 코드를 남에게 주면 옥·구매 소유(starterOwned)까지 복제될 수 있다. 막으려면 서버 계정이 필요하다.
const SaveCode = {
  hash(s){ let h = 0x811c9dc5; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16).padStart(8, "0"); },
  pack(m){ const j = JSON.stringify(m), u = new TextEncoder().encode(j); let s = ""; for (let i=0;i<u.length;i++) s += String.fromCharCode(u[i]); return "SSD1:" + btoa(s) + ":" + this.hash(j); },
  unpack(code){ // → {meta} 또는 {err}

      const mm = /^SSD1:([A-Za-z0-9+/=]+):([0-9a-f]{8})$/.exec(code); if (!mm) return {err:"저장 코드 모양이 아니에요. 처음부터 끝까지 그대로 붙여 넣어 주세요."};

      return {meta:normMeta(o)};
    } catch(e){ return {err:"저장 코드를 읽지 못했어요."}; }
  },
  summary(m){ // 진행량 비교용(클라우드·저장 코드 충돌 때 더 많이 진행한 쪽 표시)
    const st = m.stars.slice(1).reduce((a,b) => a+b, 0) + m.ch.slice(1).reduce((a,c) => a + c[0] + c[1], 0), hd = m.hard.reduce((a,b) => a+b, 0), last = m.stars.reduce((a,v,i) => v > 0 ? i : a, -1);
    const hl = Object.keys(m.heroes).reduce((a,k) => a + (m.heroes[k] || 0), 0), cs = Object.keys(m.castle.b).reduce((a,k) => a + m.castle.b[k], 0), lv = hl + cs;

    const parts = {"별":st, "어려움 별":hd, "최종장 별":fin, "진지 별":rb, "대장간":fg, "내 성":cs, "쇠":iron, "옥":m.jade, "장수 각성":aw, "설계도":bpk.length};
    return {parts, score:st*100 + hd*120 + lv*40 + fin*300 + rb*60 + fg*50 + iron + m.jade + aw*(typeof JADE_USE !== "undefined" ? JADE_USE.awake : 80) + bpv,
      text:"별 "+st+" · 어려움 별 "+hd+" · 최종장 별 "+fin+" · 진지 별 "+rb+" · 대장간 "+fg+(aw ? " · 각성 "+aw : "")+(bpk.length ? " · 설계도 "+bpk.length : "")+" · 쇠 "+iron+" · 옥 "+m.jade+" · "+(last >= 0 ? STAGES[last].title.split(" · ")[0]+"까지 깸" : "아직 시작 전")};
  },
  // 항목별 진행 기록(합계가 아니라 하나하나). 검수 v7 2차: 장수별 수련, 진지 단계별 별, 무기 계통별 강화가 서로 달라도 잃는 기록을 잡는다
  detail(m){ const d = {}, put = (k, v) => { v = Number(v) || 0; if (v > 0) d[k] = v; };
    const short = i => { try { return STAGES[i].title.split(" · ")[0]; } catch(e){ return i+"장"; } };
    (m.stars || []).forEach((v, i) => { if (i) put(short(i)+" 별", v); });
    (m.ch || []).forEach((c, i) => { if (i && c){ put(short(i)+" 도전 1", c[0] ? 1 : 0); put(short(i)+" 도전 2", c[1] ? 1 : 0); } });
    (m.hard || []).forEach((v, i) => { if (i) put(short(i)+" 어려움 별", v); });
    const hs = m.heroes || {}; Object.keys(hs).forEach(k => put("장수 수련("+((typeof HEROES !== "undefined" && HEROES[k]) ? HEROES[k].name : k)+")", hs[k]));

  R.gates.forEach(g => { for (const e of R.enemies){ if (e.dead || e.fly) continue; const d = dist(g.x + .5, g.y + .5, e.x, e.y); if (d < bd){ bd = d; best = g; } } });
  return best || R.gates[0];
}

function updateTac(dt){ // 매 프레임(물결이 흐를 때): 쿨다운, 기름 느려짐, 불화살 맞히기, 첫 귀띔

      c.strokeStyle = "rgba(255,170,60," + (.8*a) + ")"; c.lineWidth = Math.max(2, T*.05); circle(c, px, py, rad); c.stroke();
      const r = rng(f.seed); for (let i = 0; i < 7; i++){ const an = r()*Math.PI*2, d = Math.sqrt(r())*rad*.85, fx = px + Math.cos(an)*d, fy = py + Math.sin(an)*d, fl = T*(.18 + .12*Math.sin(f.t*14 + i));

  }
}
